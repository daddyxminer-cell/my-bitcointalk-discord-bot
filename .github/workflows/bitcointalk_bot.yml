name: Bitcointalk PoW coin notifier

on:
  schedule:
    # rn every 15 mins 
    - cron: '*/15 * * * *'
  workflow_dispatch: # test manuall

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f bitcointalk_bot/requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Monitor Bot
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        NOTIFY_TOKENS: false #  Set it to true if you also want to receive token alerts
      run: python bitcointalk_bot/bot.py
